name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 portable
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm test
          npm run check

      - name: Build portable executable
        run: npm run dist:win
        env:
          NODE_USE_SYSTEM_CA: "1"

      - name: Verify portable artifact name
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $artifact = "release/Paper-Ocean-$version-win-x64.exe"
          if (-not (Test-Path -LiteralPath $artifact)) {
            throw "Expected portable artifact was not created: $artifact"
          }
          Get-Item -LiteralPath $artifact | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-ocean-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS universal unsigned preview
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm test
          npm run check

      - name: Build unsigned universal DMG
        run: npm run dist:mac
        env:
          NODE_USE_SYSTEM_CA: "1"

      - name: Verify DMG and universal executable
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          package_version="$(node -p "require('./package.json').version")"
          test "$(basename "$dmg_path")" = "Paper-Ocean-${package_version}-mac-universal.dmg"
          hdiutil verify "$dmg_path"

          app_path="release/mac-universal/Paper Ocean.app"
          executable="$app_path/Contents/MacOS/Paper Ocean"
          test -x "$executable"
          architectures="$(lipo -archs "$executable")"
          echo "Application architectures: $architectures"
          [[ "$architectures" == *"x86_64"* ]]
          [[ "$architectures" == *"arm64"* ]]

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-ocean-macos-universal-unsigned
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum Paper-Ocean-* > SHA256SUMS.txt

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/*
          --verify-tag
          --generate-notes
          --prerelease
          --title "Paper Ocean ${{ github.ref_name }}"
