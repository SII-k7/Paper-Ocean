name: Windows preview
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build/**, electron/**, src/**, test/**, scripts/**, 'package*.json', index.html, vite.config.ts, .github/workflows/windows-build.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Verify real update downloads
        run: node_modules/.bin/electron scripts/smoke-update-download.mjs
      - run: npm run dist:win
        env:
          NODE_USE_SYSTEM_CA: "1"
      - name: Verify installers and update metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $artifact = "release/Paper-Ocean-$version-win-x64.exe"
          if (-not (Test-Path -LiteralPath $artifact)) { throw "Expected portable artifact was not created" }
          Get-Item -LiteralPath $artifact | Select-Object Name, Length
          node scripts/verify-update-manifests.mjs windows
          if ($LASTEXITCODE -ne 0) { throw "Update metadata validation failed" }
      - name: Test installed Windows application
        run: |
          npm install --no-save --package-lock=false playwright@1.61.1
          node scripts/smoke-windows-installed.mjs
      - name: Test independent auxiliary conversation
        run: node scripts/smoke-auxiliary-chat.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: paper-ocean-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-screenshot
          path: |
            output/windows-smoke/*
            output/playwright/auxiliary-chat/*.png
