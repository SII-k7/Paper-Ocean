name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Ubuntu packages and smoke tests
    uses: ./.github/workflows/linux-preview.yml

  windows:
    name: Windows x64 portable
    uses: ./.github/workflows/windows-build.yml

  macos:
    name: macOS universal unsigned preview
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm test
          npm run check

      - name: Build unsigned universal DMG
        run: npm run dist:mac
        env:
          NODE_USE_SYSTEM_CA: "1"

      - name: Verify DMG and universal executable
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          package_version="$(node -p "require('./package.json').version")"
          test "$(basename "$dmg_path")" = "Paper-Ocean-${package_version}-mac-universal.dmg"
          hdiutil verify "$dmg_path"

          app_path="release/mac-universal/Paper Ocean.app"
          executable="$app_path/Contents/MacOS/Paper Ocean"
          test -x "$executable"
          architectures="$(lipo -archs "$executable")"
          echo "Application architectures: $architectures"
          [[ "$architectures" == *"x86_64"* ]]
          [[ "$architectures" == *"arm64"* ]]

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-ocean-macos-universal-unsigned
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
      - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: paper-ocean-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum Paper-Ocean-* latest*.yml > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags=(--prerelease)
          fi
          notes_flags=(--generate-notes)
          if [[ -f "docs/${GITHUB_REF_NAME}.md" ]]; then
            notes_flags=(--notes-file "docs/${GITHUB_REF_NAME}.md")
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag \
            "${release_flags[@]}" "${notes_flags[@]}" --title "Paper Ocean $GITHUB_REF_NAME"
