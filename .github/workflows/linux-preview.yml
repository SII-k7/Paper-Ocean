name: Ubuntu preview
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ubuntu-paper-pool]
permissions:
  contents: read
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
      - name: Verify packages
        run: |
          version=$(node -p "require('./package.json').version")
          test -s "release/Paper-Ocean-${version}-linux-amd64.deb"
          test -s "release/Paper-Ocean-${version}-linux-x86_64.AppImage"
          dpkg-deb --info "release/Paper-Ocean-${version}-linux-amd64.deb"
          sudo apt-get update
          sudo apt-get install -y "./release/Paper-Ocean-${version}-linux-amd64.deb"
      - name: Configure application-specific sandbox policy
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo tee /etc/apparmor.d/paper-ocean-ci >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile paper-ocean-ci $GITHUB_WORKSPACE/node_modules/electron/dist/electron flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/paper-ocean-ci
      - name: Run actual Electron window
        run: xvfb-run -a node_modules/.bin/electron scripts/smoke-linux.mjs
      - name: Test installed Ubuntu package
        run: |
          npm install --no-save --package-lock=false playwright@1.61.1
          xvfb-run -a node scripts/smoke-linux-installed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os == 'ubuntu-22.04' && 'paper-ocean-linux-x64' || 'ubuntu-24.04-validation-packages' }}
          path: |
            release/*.deb
            release/*.AppImage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-screenshots-${{ matrix.os }}
          path: output/linux-smoke/*
